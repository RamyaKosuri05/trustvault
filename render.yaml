services:
  - type: web
    name: trustvault-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /app/storage
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ALLOW_DEMO_SEED
        value: "false"
    disk:
      name: trustvault-storage
      mountPath: /app/storage
      sizeGB: 10
    buildCommand: "alembic upgrade head"
    startCommand: "gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120"

databases:
  - name: trustvault-db
    plan: starter
    databaseName: trustvault
    user: trustvault
    region: oregon
    postgresMajorVersion: "15"

