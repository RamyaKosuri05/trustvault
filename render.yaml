services:
  - type: web
    name: trustvault-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        value: postgres
      - key: LOCAL_STORAGE_PATH
        value: /app/storage
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ALLOW_DEMO_SEED
        value: "true"
    startCommand: "/app/start.sh"

databases:
  - name: trustvault-db
    plan: starter
    databaseName: trustvault
    user: trustvault
    region: oregon
    postgresMajorVersion: "15"

