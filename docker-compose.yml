version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: trustvault_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trustvault}
      POSTGRES_USER: ${POSTGRES_USER:-trustvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustvault_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustvault} -d ${POSTGRES_DB:-trustvault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustvault_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trustvault}:${POSTGRES_PASSWORD:-trustvault_dev_password}@db:5432/${POSTGRES_DB:-trustvault}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-32-chars-min}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /app/storage
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:24-alpine
    container_name: trustvault_frontend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  storage_data:

